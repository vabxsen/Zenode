name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, package
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 24 ships npm 11, which honours package.json "allowScripts".
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Build installer
        run: npm run dist
        env:
          # Unsigned for now; skip looking for a signing certificate.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Check the packaged app (fuses, start-up, tamper refusal)
        run: npm run check:package

      # Installs an older build, updates it to this one from a local feed, then uninstalls.
      - name: Check install, update and uninstall
        run: npm run check:install
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: zenode-windows
          path: |
            dist/Zenode-Setup-*.exe
            dist/Zenode-*-portable.exe
          retention-days: 14

      # Fails the build on high or critical advisories in what ships with the app.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Development tools: reported, not blocking.
      - name: Audit all dependencies
        run: npm audit --audit-level=high
        continue-on-error: true
