name: Microsoft Store package

# Builds the package to upload in Partner Center (dist/Zenode-<version>-store.appx)
# and keeps it as a download on the run's page for 30 days. The Store signs it.
# Runs for every version tag once build/store-identity.json exists, or by hand
# (Actions > Microsoft Store package > Run workflow). Pull requests that change
# the Store setup, and "test" runs, build with a made-up identity to check the
# package (not for upload).
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'package.json'
      - 'scripts/build-store.mjs'
      - 'build/appx/**'
      - '.github/workflows/store.yml'
  workflow_dispatch:
    inputs:
      test:
        description: 'Test package (made-up identity, not for upload)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  TEST_BUILD: ${{ github.event_name == 'pull_request' || inputs.test == true }}

jobs:
  store:
    name: Build the Store package
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Is the Store identity set up?
        id: identity
        shell: bash
        run: |
          if [[ "$TEST_BUILD" == "true" || -f build/store-identity.json ]]; then echo "build=yes" >> "$GITHUB_OUTPUT"
          else echo "No build/store-identity.json yet: nothing to build (see docs/microsoft-store.md)."; fi

      - uses: actions/setup-node@v7
        if: steps.identity.outputs.build == 'yes'
        with:
          node-version: 24
          cache: npm

      - name: Install
        if: steps.identity.outputs.build == 'yes'
        run: npm ci

      - name: Build
        if: steps.identity.outputs.build == 'yes'
        shell: bash
        run: npm run ${{ env.TEST_BUILD == 'true' && 'dist:store:test' || 'dist:store' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          MAIN_VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          MAIN_VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          MAIN_VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          MAIN_VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      - name: Keep the package
        if: steps.identity.outputs.build == 'yes'
        uses: actions/upload-artifact@v7
        with:
          name: zenode-store-package
          path: dist/Zenode-*-store.appx
          if-no-files-found: error
          retention-days: 30
