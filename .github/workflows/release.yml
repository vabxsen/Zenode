name: Release

# Pushing a version tag (v1.2.3, or v1.2.3-beta.1 for a pre-release) builds
# Zenode and publishes a GitHub Release with the installer, the portable exe, the
# zip and the files the updater reads. The notes come from CHANGELOG.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check the tag, package.json and CHANGELOG.md agree
        run: node scripts/release-notes.mjs --check "${{ github.ref_name }}"

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Check the packaged app
        run: npm run check:package

      # Releases are unsigned for now. To sign with Azure Trusted Signing, add
      # win.azureSignOptions to package.json and the AZURE_* secrets here;
      # electron-builder then signs during "Build".
      - name: Sign
        run: echo "Unsigned build (code signing is not set up yet)."

      - name: Write the release notes
        run: node scripts/release-notes.mjs "${{ github.ref_name }}" > release-notes.md

      - name: Publish the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          version="${TAG#v}"
          files=(dist/Zenode-Setup-*.exe dist/Zenode-Setup-*.exe.blockmap dist/Zenode-*-portable.exe dist/Zenode-*-win-*.zip dist/latest.yml dist/beta.yml dist/alpha.yml)
          flags=()
          # A version with a suffix (1.2.0-beta.1) is a pre-release: only the beta channel gets it.
          if [[ "$version" == *-* ]]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$TAG" "${files[@]}" --title "Zenode $version" --notes-file release-notes.md --verify-tag "${flags[@]}"
